# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Sahi.xcodeproj is already included; use this only if you need to regenerate it:
#   brew install xcodegen && xcodegen generate
name: Sahi
options:
  bundleIdPrefix: org.sahi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    minorVersion: 2.55.0
targets:
  Sahi:
    type: application
    platform: iOS
    sources:
      - path: Sahi
    configFiles:
      Debug: Config/Sahi.xcconfig
      Release: Config/Sahi.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sahi.inventory
        INFOPLIST_FILE: Config/Sahi-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: Supabase
        product: Supabase
  SahiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SahiTests
    dependencies:
      - target: Sahi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: 1
schemes:
  Sahi:
    build:
      targets:
        Sahi: all
        SahiTests: [test]
    test:
      targets:
        - SahiTests
